<!doctype html>
<html lang="{{LANG}}"{{THEME_ATTR}}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="{{CANONICAL}}">
{{HREFLANG}}
<meta name="theme-color" content="#1E4CB3">
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
<meta property="og:type" content="{{OG_TYPE}}">
<meta property="og:site_name" content="{{BRAND}}">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:title" content="{{OG_TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:locale" content="{{OG_LOCALE}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{OG_TITLE}}">
<meta name="twitter:description" content="{{DESCRIPTION}}">
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/style.css">
<script>
/* Runs before first paint. Two jobs, both about avoiding a flash:
   apply a saved theme, and mark that scripting is on so the reveal styles
   engage from the very first frame instead of after `defer` fires. */
document.documentElement.classList.add('js');
try { var t = localStorage.getItem('platizhka-theme');
      if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<script type="application/ld+json">{{JSONLD}}</script>
</head>
<body>

<header class="top">
  <div class="shell top__in">
    <a class="brand" href="{{HOME}}">
      <span class="brand__mark" aria-hidden="true">{{MARK}}</span>
      <span>{{BRAND}}</span>
    </a>
    <nav aria-label="{{L_NAV}}">
{{NAV}}
      <span class="langs">{{LANGSWITCH}}</span>
      <button class="themebtn" type="button" aria-label="{{L_THEME}}"
              data-label-dark="{{L_THEME}}" data-label-light="{{L_THEME}}">
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
      </button>
    </nav>
  </div>
</header>

<main id="main">
{{BODY}}
</main>

<footer class="foot">
  <div class="shell foot__in">
    <div>© {{YEAR}} {{BRAND}} · <a href="mailto:{{CONTACT}}">{{CONTACT}}</a></div>
    <div>
      <a href="{{INSTALL_URL}}">Google Play</a> ·
      <a href="{{PRIVACY_URL}}">{{L_PRIVACY}}</a>
    </div>
  </div>
</footer>

<script src="/assets/app.js" defer></script>
</body>
</html>
